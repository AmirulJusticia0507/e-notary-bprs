services:
  postgres:
    image: postgres:15-alpine
    container_name: bprs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bprs_enotary}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations
    command: [
      "-path", "/migrations",
      "-database", "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bprs_enotary}?sslmode=disable",
      "up",
    ]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: bprs-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin123}
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "${KC_PORT:-8180}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bprs-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      # Di dalam docker, Keycloak dijangkau via nama service (browser tetap pakai localhost:8180).
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/enotary
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  pgdata:
